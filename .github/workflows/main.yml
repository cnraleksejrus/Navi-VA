name: Android APK bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: APK bauen
        run: flutter build apk --release --andro

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Navi-VA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
